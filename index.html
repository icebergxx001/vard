        <script type="text/javascript">
            var interval_id = 0;
            // console.log($("#img-buffer").attr('src'))
            function getqrcode() {
                clearInterval(interval_id);
                $.ajax({
                    type: "POST",
                    url: "/vcard/getqrcode",
                    dataType: "json",
                    beforeSend: function(xhr) {
                        var header = $('meta[name=_csrf_header]').attr('content');
                        var token = $('meta[name=_csrf]').attr('content');
                        // console.log(header)
                        // console.log(xhr)
                        if (header != '' && token != '') {
                            xhr.setRequestHeader(header, token);
                        }
                    },
                    success: function(data) {
                        // console.log(data);
                        if (data.qrcode != null && data.qrcode != '' && data.qrcode != 'undefined') {
                            var qcode = data.qrcode;
                            $("#qrcode").val("");
                            $("#qrcode").html("");
                            if (undefined != qcode && null != qcode && "" != qcode) {
                                $('#qrcode').qrcode({
                                    render: "canvas",
                                    //设置渲染方式 （有两种方式 table和canvas，默认是canvas）
                                    width: 220,
                                    //宽度
                                    height: 220,
                                    //高度
                                    correctLevel: QRCode.CorrectLevel.Q,
                                    //纠错等级
                                    text: qcode,
                                    //生成二维码的文本
                                    background: "#ffffff",
                                    //背景色
                                    foreground: "#000000",
                                    //前景色
                                    mode: 4,
                                    mSize: 16 * 0.01,
                                    mPosX: 50 * 0.01,
                                    mPosY: 50 * 0.01,
                                    //image: $("#img-buffer")[0]
                                });
                            }
                            interval_id = setInterval("getqrcode()", 1000 * 60);
                        } else {
                            alert(data ? data.error : '错误');
                        }
                    },
                    error: function() {
                        // console.log(111)
                        $.hideLoading();
                        alert("请求异常");
                        interval_id = setInterval("getqrcode()", 1000 * 60);
                    }
                });
            }
        </script>

                let deptname = '2021级研究生';
                // let deptname = '深圳市南科大资产';
                let lenth = deptname.length;
                // if(lenth>5 && lenth <10){
                //     $('.deptname1').text(deptname.substr(0,5))
                //     $('.deptname2').text(deptname.substr(5,lenth-5))
                // }else
                if (lenth > 8) {
                    $('.deptname1').text(deptname.substr(0, lenth % 2 == 0 ? lenth / 2 : (lenth - 1) / 2))
                    $('.deptname2').text(deptname.substr(lenth % 2 == 0 ? lenth / 2 : (lenth - 1) / 2, lenth % 2 == 0 ? lenth / 2 : (lenth + 1) / 2))
                } else {
                    $('.deptname1').text(deptname)
                }
                $(".eyes").click(function() {
                    $(this).hide();
                    $('.balance').show();
                });
                $(".balance").click(function() {
                    $(this).hide();
                    $('.eyes').show();
                });
                $('.vcard-con-header-qrcode').click(function() {
                    $('.vcard-con').hide();
                    $('.vcard-to').hide();
                    $('.vcard-qr').css('display', 'flex');
                    interval_id = setInterval("getqrcode()", 60 * 1000);
                    getqrcode();
                });
                $('.vcard-qr-exit-box').click(function() {
                    $('.vcard-con').show();
                    $('.vcard-to').show();
                    $('.vcard-qr').hide();
                    clearInterval(interval_id);
                });

                // 初始化语言设置
                var currentLanguage = localStorage.getItem('language') || 'cn';
                if (currentLanguage === 'en') {
                    $('#languageSwitch').prop('checked', true);
                }
                updateTexts(currentLanguage);

                // 添加切换事件
                $('#languageSwitch').on('change', function() {
                    var newLanguage = $(this).is(':checked') ? 'en' : 'cn';
                    localStorage.setItem('language', newLanguage);
                    updateTexts(newLanguage);
                });

                function updateTexts(language) {
                    console.log(language);
                    // 遍历所有以show_开头的元素
                    const elements = document.querySelectorAll('[id^="show_"]');
                    elements.forEach(element => {
                        const id = element.id;
                        console.log(id);
                        if (translations[id]) {
                            element.textContent = translations[id][language];
                        }
                        if (id == 'show_deptkey') {
                            element.textContent = translations[id + "_" + '年级'][language];
                        }
                        if (id == 'show_status') {
                            element.textContent = translations[id + "_" + '正常'][language];
                        }
                        $('head').append('<style>.vcard-con-header:after{content: "' + translations["show_paycode"][language] + '" !important;}</style>');
                    }
                    );

                }

            });
